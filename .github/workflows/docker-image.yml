name: Docker Image CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "19.x"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps && npm install --prefix ./packages/client --legacy-peer-deps && npm install --prefix ./packages/server --legacy-peer-deps

      - name: Build client
        run: npm run build --prefix ./packages/client
        env:
          CI: false

      - name: Build server
        run: npm run build --prefix ./packages/server

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: packages/client/build/
          retention-days: 1

  build-and-push-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image for server
        uses: docker/build-push-action@v4
        with:
          context: ./packages/server
          file: ./packages/server/Dockerfile
          tags: react-nestjs-server:latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

  deploy:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./client-build-temp/

      - name: Verify artifact contents
        run: |
          echo "=== Checking artifact contents ==="
          ls -la ./client-build-temp/
          echo "=== Full directory tree ==="
          find ./client-build-temp/ -type f | head -20

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /home/admin/react-nestjs
            cd /home/admin/react-nestjs
            if [ -d .git ]; then
              git pull origin main
            else
              git clone https://github.com/yamajikosuke/react-nestjs.git .
            fi

            # Deploy backend with docker-compose
            cd packages/server
            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml not found in packages/server"
              exit 1
            fi
            docker-compose down || true
            docker-compose up -d --build

      - name: Copy client build to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./client-build-temp/"
          target: "/tmp/client-build"
          strip_components: 1

      - name: Deploy client files to web root
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Starting client deployment ==="
            echo "Checking /tmp/client-build contents:"
            ls -la /tmp/client-build/ | head -20

            # Prepare web root
            mkdir -p /var/www/html

            # Copy files - try to preserve ownership
            if [ -d /tmp/client-build ]; then
              echo "Copying files to /var/www/html..."
              rm -rf /var/www/html/*
              cp -r /tmp/client-build/* /var/www/html/
              
              # Try to set proper ownership if running as root or with sudo
              if command -v sudo &> /dev/null; then
                sudo chown -R www-data:www-data /var/www/html/ 2>/dev/null || chown -R www-data:www-data /var/www/html/ 2>/dev/null || true
                sudo chmod -R 755 /var/www/html/ 2>/dev/null || chmod -R 755 /var/www/html/ 2>/dev/null || true
              else
                chown -R www-data:www-data /var/www/html/ 2>/dev/null || true
                chmod -R 755 /var/www/html/ 2>/dev/null || true
              fi
              
              echo "✅ Client build deployed to /var/www/html"
              echo "=== Final verification ==="
              ls -la /var/www/html/ | head -20
            else
              echo "❌ Error: /tmp/client-build not found"
              exit 1
            fi
