name: Docker Image CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "19.x"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps && npm install --prefix ./packages/client --legacy-peer-deps && npm install --prefix ./packages/server --legacy-peer-deps

      - name: Build client
        run: npm run build --prefix ./packages/client
        env:
          CI: false

      - name: Build server
        run: npm run build --prefix ./packages/server

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: packages/client/build/
          retention-days: 1

  build-and-push-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image for server
        uses: docker/build-push-action@v4
        with:
          context: ./packages/server
          file: ./packages/server/Dockerfile
          tags: react-nestjs-server:latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

  deploy:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./client-build-output/

      - name: Copy client build to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./client-build-output/"
          target: "/tmp/react-build"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /home/admin/react-nestjs
            cd /home/admin/react-nestjs
            if [ -d .git ]; then
              git pull origin main
            else
              git clone https://github.com/yamajikosuke/react-nestjs.git .
            fi

            # Deploy backend with docker-compose
            cd packages/server
            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml not found in packages/server"
              exit 1
            fi
            docker-compose down || true
            docker-compose up -d --build

      - name: Setup web root and deploy client files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          request_pty: true
          script: |
            echo "=== Setting up web root ==="

            # Remove old web root and create new one
            sudo rm -rf /var/www/html
            sudo mkdir -p /var/www/html

            # Copy client build files
            echo "Checking /tmp/react-build contents:"
            ls -la /tmp/react-build/

            if [ -d /tmp/react-build/client-build-output ]; then
              echo "Found client-build-output directory, copying from there..."
              sudo cp -r /tmp/react-build/client-build-output/* /var/www/html/
            elif [ -d /tmp/react-build ]; then
              echo "Copying from /tmp/react-build..."
              sudo cp -r /tmp/react-build/* /var/www/html/
            else
              echo "❌ Error: No build files found in /tmp/react-build"
              exit 1
            fi

            # Set proper permissions
            sudo chown -R www-data:www-data /var/www/html/
            sudo chmod -R 755 /var/www/html/

            echo "✅ Client build deployed to /var/www/html"
            echo "=== Final verification ==="
            ls -la /var/www/html/ | head -20

            # Cleanup
            rm -rf /tmp/react-build
